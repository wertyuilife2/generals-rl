[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "generals-baselines"
version = "0.1.0"
description = "Observation-only heuristic baselines for Generals"
requires-python = ">=3.11"
dependencies = ["generals-env", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["generals_baselines*"]

[tool.setuptools.package-data]
generals_baselines = ["policy.cpp"]
