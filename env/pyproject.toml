[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "generals-env"
version = "0.1.0"
description = "A minimal deterministic CPU Generals game with Tk GUI and headless simulation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.scripts]
generals-env = "generals_env.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
