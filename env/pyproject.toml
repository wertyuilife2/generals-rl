[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "generals-env"
version = "0.1.0"
description = "Generals environment with CPU/CUDA vector simulation and Tk desktop play"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.scripts]
generals-env = "generals.cli:main"
generals = "generals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["generals", "generals.*"]

[project.optional-dependencies]
gpu = ["torch>=2.6"]
play = ["generals-baselines"]

[tool.setuptools.package-data]
"generals.backends" = ["rules.h"]
"generals.backends.cpu" = ["step.cpp"]
"generals.benchmarks" = ["native.cpp"]
"generals.backends.gpu" = ["kernel.cu", "host.cpp"]
